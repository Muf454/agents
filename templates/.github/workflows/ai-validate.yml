# Installed by the AI development toolkit: runs the project's validation gate on
# every pull request, independently of the agents' own runs. Add setup steps for
# your toolchain if ubuntu-latest's defaults aren't enough (e.g. actions/setup-node).
name: ai-validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (.ai/ci-setup)
        run: bash .ai/ci-setup
      - name: Validate (.ai/validate)
        run: bash .ai/validate
